<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة هديل - Hadeel Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #12161c;
            color: #eceff1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e2329;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b313a;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f0b90b;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            background-color: #2b313a;
            color: #fff;
            border: 1px solid #474d57;
            padding: 8px 14px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: calc(100vh - 70px);
        }
        .chart-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ منصة هديل | Hadeel Platform</div>
        
        <div class="controls">
            <label for="pairSelect">العملة / السوق:</label>
            <select id="pairSelect" onchange="switchPair()">
                <option value="BINANCE:BTCUSDT">Bitcoin (BTC/USDT)</option>
                <option value="BINANCE:ETHUSDT">Ethereum (ETH/USDT)</option>
                <option value="BINANCE:SOLUSDT">Solana (SOL/USDT)</option>
                <option value="BINANCE:BNBUSDT">BNB (BNB/USDT)</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="chart-container" id="tv_chart_container"></div>
    </div>

    <!-- مكتبة TradingView الشارت المباشر -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let widget;

        function loadChart(symbol) {
            document.getElementById('tv_chart_container').innerHTML = '';
            widget = new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "toolbar_bg": "#1e2329",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tv_chart_container",
                "studies": [
                    "Volume@tv-basicstudies",
                    "RSI@tv-basicstudies"
                ]
            });
        }

        function switchPair() {
            const selectedSymbol = document.getElementById('pairSelect').value;
            loadChart(selectedSymbol);
        }

        window.onload = function() {
            loadChart('BINANCE:BTCUSDT');
        };
    </script>
</body>
</html>
