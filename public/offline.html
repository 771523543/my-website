<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f7657">
  <title>منصة هديل - دون اتصال</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f2;color:#292b23;font-family:Tahoma,Arial,sans-serif}
    main{width:min(100%,440px);padding:34px 26px;text-align:center;background:#fff;border:1px solid #e7e8df;border-radius:24px;box-shadow:0 12px 38px #25271f12}
    .logo{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;background:#6f7657;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}
    h1{margin:0 0 12px;color:#6f7657;font-size:25px}
    p{margin:0 auto 22px;line-height:1.9;color:#65675e;font-size:15px}
    button{border:0;border-radius:12px;padding:12px 22px;background:#6f7657;color:#fff;font:700 15px Tahoma,Arial,sans-serif;cursor:pointer}
    small{display:block;margin-top:18px;color:#92948b;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">هـ</div>
    <h1>منصة هديل</h1>
    <p>يبدو أنكِ غير متصلة بالإنترنت حالياً. يمكنكِ العودة إلى الصفحات التي سبق حفظها، أو إعادة المحاولة عند توفر الاتصال.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <small>بعض الخدمات مثل إرسال الطلبات ورفع الملفات تحتاج إلى اتصال بالإنترنت.</small>
  </main>
</body>
</html>
